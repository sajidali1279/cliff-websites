name: Deploy royalfootwear.cliffindus.com

on:
  push:
    branches: [main]
    paths:
      - "royalfootwear.cliffindus.com/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: royalfootwear.cliffindus.com
          command: deploy
